name: Build Free

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mareo_mapper.py'
      - 'mareo_gui.py'
      - 'requirements.txt'
      - 'build_windows.ps1'
      - 'build_linux.sh'
      - '.github/workflows/build-free.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Mareo_Identifica_Infra_FREE_Windows
          path: dist/Mareo_Identifica_Infra_FREE.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Linux
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mareo_Identifica_Infra_FREE_Linux
          path: dist/mareo-identifica-infra-free
